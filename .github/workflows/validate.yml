name: Validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test skill, examples, converter, and web contract
        run: python -m unittest discover -s tests -v
      - name: Check web JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('web/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (!scripts.length) throw new Error('No inline script found');
          scripts.forEach((match) => new Function(match[1]));
          console.log(`Validated ${scripts.length} inline script(s)`);
          NODE
